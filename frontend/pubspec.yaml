name: green3neo
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

# The minimum SDK (Dart) version corresponds to the Dart version bundled with flutter
# The minimum flutter version corresponds to the FVM config file
environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  currency_widget: ^1.0.7
  data_table_2: ^3.0.0
  ffi: ^2.0.2
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_form_builder: ^11.0.0
  flutter_rust_bridge: 2.12.0
  # form_builder_validators does not support modern material_ui yet
  # form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  listen_it: ^5.3.4
  watch_it: ^2.4.1
  intl: ^0.20.2
  logging: ^1.3.0
  material_ui: ^1.0.1
  pair: ^0.1.2
  provider: ^6.1.1
  reflectable: ^5.2.3
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0
  freezed: ^4.0.0-dev.3
  reflectable_builder: ^1.2.3

flutter:
  uses-material-design: true
  generate: true
