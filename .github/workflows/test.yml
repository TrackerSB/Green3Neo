name: Test project
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Test-Backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db-protocol: ['postgres', 'mysql']
        over-ssh: [false, true]
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@a9a0a3cc1c9fff98990c4c25d0ec55c67e9c35c1
      - name: Override environment variables and update dependent ones
        run: |
          echo "BUILD_DB_PROTOCOL=${{ matrix.db-protocol }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ matrix.db-protocol }}://$BUILD_DB_USER:$BUILD_DB_PASSWORD@$BUILD_DB_HOST:$BUILD_DB_PORT/$BUILD_DB_NAME" >> $GITHUB_ENV
        shell: bash
      - uses: ./.github/actions/prepare-backend-build
      - name: Set environment variables for SSH
        if: ${{ matrix.over-ssh }}
        # FIXME Do not duplicate server information. Receive it from SSH setup action instead
        run: |
          echo "SSH_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "SSH_PORT=22" >> $GITHUB_ENV
          echo "SSH_USER=root" >> $GITHUB_ENV
          echo "SSH_PASSWORD=safeRootPassword" >> $GITHUB_ENV
        shell: bash
      - uses: ./.github/actions/setup-ssh-server
        if: ${{ matrix.over-ssh }}
      - name: Install command line for executing tests and combining results
        working-directory: ${{ github.workspace }}/frontend
        run: |
          cargo install --locked cargo-nextest
          fvm dart pub global activate junitreport
        shell: bash
      - name: Execute tests
        run: just backend-test
      - name: Upload test results
        if: ${{ !cancelled() && !github.event.act }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: testResultsArtifact_backend_${{ matrix.db-protocol }}
          path: backend/target/nextest/default/junit.xml
  Test-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@a9a0a3cc1c9fff98990c4c25d0ec55c67e9c35c1
      - uses: ./.github/actions/prepare-application-build
      - name: Install command line for executing tests and combining results
        working-directory: ${{ github.workspace }}/frontend
        run: |
          cargo install --locked cargo-nextest
          fvm dart pub global activate junitreport
        shell: bash
      - name: Execute tests
        run: just frontend-test
      - name: Upload test results
        if: ${{ !cancelled() && !github.event.act }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: testResultsArtifact_frontend
          path: frontend/build/junit.xml
  Publish-Test-Results:
    runs-on: ubuntu-latest
    needs: [Test-Backend, Test-Frontend]
    permissions:
      checks: write
      pull-requests: write
    if: ${{ !cancelled() && !github.event.act }}
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "testResultsArtifact_*"
      - name: Display all downloaded files
        run: ls -R
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        id: test-results
        with:
          files: "testResultsArtifact_*/**/junit.xml"
          comment_mode: off
          check_run: true
          ignore_runs: true
          job_summary: false
          check_run_annotations: all tests, skipped tests
          action_fail: true
          action_fail_on_inconclusive: true
      - name: Set test results badge color
        run: |
          case ${{ fromJSON( steps.test-results.outputs.json ).conclusion }} in
            success)
              echo "TESTRESULT_BADGE_COLOR=31c653" >> $GITHUB_ENV
              ;;
            failure)
              echo "TESTRESULT_BADGE_COLOR=800000" >> $GITHUB_ENV
              ;;
            neutral)
              echo "TESTRESULT_BADGE_COLOR=696969" >> $GITHUB_ENV
              ;;
          esac
        shell: bash
      - name: Create test results badge
        if: ${{ github.ref_name == 'main' }}
        uses: emibcn/badge-action@v2.0.4
        with:
          label: tests
          status: '${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.tests }} tests (main) -> ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}'
          color: ${{ env.TESTRESULT_BADGE_COLOR }}
          path: testResultsBadge.svg
      - name: Upload test results badge to Gist
        if: ${{ github.ref_name == 'main' }}
        uses: andymckay/append-gist-action@0.3
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gistURL: https://gist.githubusercontent.com/TrackerSB/4efe24e16b30d0132bbb1f3fb618f86c
          file: testResultsBadge.svg
