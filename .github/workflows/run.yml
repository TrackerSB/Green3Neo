name: Run project
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Run-App:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISPLAY: :99
      BUILD_DB_PROTOCOL: 'postgres'
      WINDOW_TITLE: Green3Neo

    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@a9a0a3cc1c9fff98990c4c25d0ec55c67e9c35c1
      - uses: ./.github/actions/prepare-application-run
        with:
          virtual_display_number: ${{ env.DISPLAY }}
      - name: Install GUI smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool imagemagick tesseract-ocr
      - name: Build debug application
        run: just frontend-build-debug
      - name: Start headless smoke test application
        run: |
          cd frontend/build/linux/x64/debug/bundle
          LANG=en_US.UTF-8 \
          LC_ALL=en_US.UTF-8 \
          FLUTTER_ENGINE_SWITCHES=2 \
          FLUTTER_ENGINE_SWITCH_1='enable-software-rendering=true' \
          FLUTTER_ENGINE_SWITCH_2='enable-impeller=false' \
          ./green3neo > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          echo "Application started with PID $APP_PID"
      - name: Verify application window and visible content
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited before creating its window"
              cat app.log
              exit 1
            fi
            WINDOW_ID="$(xdotool search --onlyvisible --name "^${WINDOW_TITLE}$" 2>/dev/null | head -n 1 || true)"
            if [ -n "$WINDOW_ID" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "${WINDOW_ID:-}" ]; then
            echo "Application window titled $WINDOW_TITLE did not appear"
            cat app.log
            exit 1
          fi

          SCREENSHOT="$GITHUB_WORKSPACE/app-smoke-test.png"
          OCR_SCREENSHOT="$(mktemp --suffix=.png)"
          trap 'rm -f "$OCR_SCREENSHOT"' EXIT
          OCR_TEXT=""
          for attempt in $(seq 1 10); do
            import -window "$WINDOW_ID" "$SCREENSHOT"
            convert "$SCREENSHOT" -resize 200% "$OCR_SCREENSHOT"
            OCR_TEXT="$(tesseract "$OCR_SCREENSHOT" stdout -l eng --psm 11 2>/dev/null)"
            if grep -qi 'Settings' <<< "$OCR_TEXT"; then
              break
            fi
            sleep 1
          done
          echo "$OCR_TEXT"
          if ! grep -qi 'Settings' <<< "$OCR_TEXT"; then
            echo "Expected visible Settings control was not found in the application window"
            exit 1
          fi
      - name: Stop application
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          fi
      - name: Upload application smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: application-smoke-test
          path: |
            app.log
            app-smoke-test.png
