name: Analyze project
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Analyze-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@a9a0a3cc1c9fff98990c4c25d0ec55c67e9c35c1
      - uses: ./.github/actions/prepare-application-build
      - name: Generate Flutter API bindings (based on PostgreSQL)
        run: just frb-generate postgres postgres
      - name: Analyze frontend
        working-directory: frontend
        run: fvm flutter analyze --fatal-infos
