name: Build project
on:
  pull_request:
    branches:
      - main
jobs:
  Build-All:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db-protocol: ['postgres', 'mysql']
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@main
      - name: Override environment variables
        run: |
          echo "BUILD_DB_PROTOCOL=${{ matrix.db-protocol }}" >> $GITHUB_ENV
          echo "DATABASE_URL=$BUILD_DB_PROTOCOL://$BUILD_DB_USER:$BUILD_DB_PASSWORD@$BUILD_DB_HOST:$BUILD_DB_PORT/$BUILD_DB_NAME" >> $GITHUB_ENV
        shell: bash
      - uses: ./.github/actions/prepare-application-build
      - name: Execute full build
        run: just build
