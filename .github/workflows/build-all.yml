name: Build project
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Build-All:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db-protocol: ['postgres', 'mysql']
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@79a93308cb2f2c544054c3504813f960ce20dd80
      - name: Export PATH dirs to GITHUB_PATH
        run: |
          IFS=':' read -ra dirs <<< "${PATH}"
          for dir in "${dirs[@]}"; do
            [ -n "$dir" ] && echo "$dir" >> "$GITHUB_PATH"
          done
        shell: bash
      - name: Override environment variables and update dependent ones
        run: |
          echo "BUILD_DB_PROTOCOL=${{ matrix.db-protocol }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ matrix.db-protocol }}://$BUILD_DB_USER:$BUILD_DB_PASSWORD@$BUILD_DB_HOST:$BUILD_DB_PORT/$BUILD_DB_NAME" >> $GITHUB_ENV
        shell: bash
      - uses: ./.github/actions/prepare-application-build
      - name: Execute full build
        run: just build
