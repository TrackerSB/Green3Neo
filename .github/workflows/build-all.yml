name: Build project
on:
  pull_request:
    branches:
      - main
jobs:
  Build-All:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db-backend: ['PostgreSQL', 'MySQL']
    steps:
      - uses: TrackerSB/Green3Neo-Prepare-Action@main
      - uses: ./.github/actions/prepare-application-build
        with:
          db-backend: ${{ matrix.db-backend }}
      - name: Execute full build
        run: just build
