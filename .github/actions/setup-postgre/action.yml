name: Setup PostgreSQL
description: Set up and start a PostgreSQL server based on the environment variables given in the repository
runs:
  using: "composite"
  steps:
    - name: Setup PostgreSQL server
      uses: Daniel-Marynicz/postgresql-action@2.0.0
      with:
        postgres_db:  ${{ env.BUILD_DB_NAME }}
        exposed_postgres_port: ${{ env.BUILD_DB_PORT }}
        postgres_user: ${{ env.BUILD_DB_USER }}
        postgres_password: ${{ env.BUILD_DB_PASSWORD }}