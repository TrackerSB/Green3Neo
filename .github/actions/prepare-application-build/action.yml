name: Install application dependencies
description: Install all dependencies required for building the application
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/prepare-backend-build
    - name: Install CMake and GTK
      run: |
        sudo apt update
        sudo apt install --fix-missing cmake libgtk-3-0 libgtk-3-dev
      shell: bash
    - name: Install Ninja
      uses: turtlesec-no/get-ninja@1.1.0
