name: Install application dependencies
description: Install all dependencies required for building the application
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/prepare-backend-build
    - name: Install GTK
      run: |
        sudo apt update
        sudo apt install --fix-missing libgtk-3-0 libgtk-3-dev
      shell: bash
    - name: Install Ninja
      uses: turtlesec-no/get-ninja@1.1.0
    - name: Install FVM
      uses: chika3742/setup-fvm@v3.1.4
      with:
        project-dir: ${{ github.workspace }}/frontend
    - name: Install Flutter packages
      working-directory: ${{ github.workspace }}/frontend
      run: flutter pub get
      shell: bash
